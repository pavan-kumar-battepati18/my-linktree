<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://nicpjkvnfiorcwitprna.supabase.co';
    const supabaseKey = 'sb_publishable_ucZxPjbv09A5GHf5VDEq_A_TUsjnysi'; 
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('hire-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        
        const { data, error } = await supabase
            .from('clicks')
            .insert([{ button_name: 'Hire Me' }]);

            alert('Success! Click recorded in your Full Stack Database.');

    });
