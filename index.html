<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Link In Bio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center mb-8">
       <img src="profile.jpg.png" alt="Pavan" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-gray-800 shadow-xl object-cover">
        <h1 class="text-2xl font-bold">Pavan Kumar Battepati</h1>
       <p class="text-blue-400 font-mono text-xs mt-2 uppercase tracking-widest">
    🔥 Total Interest: <span id="click-count" class="font-bold">0</span>
</p>
        <p class="text-gray-400 italic text-sm">I am a fresher python developer</p>
    </div>

    <div class="w-full max-w-md space-y-4">
        
        <a href="#" class="block w-full py-4 px-6 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl text-center font-medium transition-all transform hover:scale-105 shadow-md">
            🚀 My First Project
        </a>

        <a href="#" class="block w-full py-4 px-6 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl text-center font-medium transition-all transform hover:scale-105 shadow-md">
            🐙 GitHub Profile
        </a>

       <a id="hire-btn" href="#" class="block w-full py-4 px-6 bg-green-600 hover:bg-green-700 rounded-xl text-center font-bold transition-all transform hover:scale-105 shadow-lg">
    💼 Hire Me
</a>

    </div>
<script>
        // Setup your keys
        const supabaseUrl = 'https://nicpjkvnfiorcwitprna.supabase.co';
        const supabaseKey = 'sb_publishable_ucZxPjbv09A5GHf5VDEq_A_TUsjnysi'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Function to LOAD the count from the database
        async function loadClickCount() {
            const { count, error } = await supabaseClient
                .from('clicks')
                .select('*', { count: 'exact', head: true });

            if (!error) {
                document.getElementById('click-count').innerText = count;
            }
        }

        // Function to SAVE a new click
        document.getElementById('hire-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            
            const { error } = await supabaseClient
                .from('clicks')
                .insert([{ button_name: 'Hire Me' }]);

            if (error) {
                alert('Database Error: ' + error.message);
            } else {
                alert('Success! Click recorded in your Full Stack Database.');
                loadClickCount(); // Refresh the number on the screen immediately
            }
        });

        // Run this when the page first opens
        loadClickCount();
    </script>
</body>
</html>
